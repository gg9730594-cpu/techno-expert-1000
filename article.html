<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статья — Техно-Эксперт</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header id="site-header"></header>

    <main>
        <div style="max-width: 820px; margin: 0 auto 1rem;">
            <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: 500;">← Назад ко всем
                статьям</a>
        </div>

        <article id="article-view" class="article-container">
            <p>Загрузка статьи...</p>
        </article>
    </main>

    <footer id="site-footer"></footer>

    <script src="data.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const articleId = params.get("id");
            const container = document.getElementById("article-view");

            const article = ARTICLES.find(a => a.id === articleId);

            if (!article) {
                container.innerHTML = `
                    <h2>Статья не найдена</h2>
                    <p style="margin: 1rem 0; color: var(--text-muted);">Возможно, ссылка устарела или была введена с ошибкой.</p>
                    <a href="index.html" class="btn">Вернуться на главную</a>
                `;
                return;
            }

            // Меняем заголовок вкладки браузера под название статьи
            document.title = `${article.title} — Техно-Эксперт`;
            const saved = isFavorite(article.id);

            container.innerHTML = `
                <div class="article-meta">
                    <div>
                        <span class="tag">${article.tag}</span>
                        <span style="margin-left: 0.75rem; font-size: 0.9rem; color: var(--text-muted);">${article.date || ""}</span>
                    </div>
                    <div style="display: flex; gap: 0.6rem; flex-wrap: wrap;">
                        <button 
                            class="fav-btn ${saved ? 'saved' : ''}" 
                            onclick="toggleFavorite('${article.id}', this)"
                        >${saved ? '❤️ В избранном' : '🤍 В избранное'}</button>
                        <button class="btn btn-outline" id="share-btn" onclick="copyArticleLink()">🔗 Поделиться</button>
                    </div>
                </div>

                <h1 style="font-size: 1.9rem; margin-bottom: 1.5rem; line-height: 1.3;">${article.title}</h1>
                <div class="article-content">${article.content}</div>
            `;
        });

        function copyArticleLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                const btn = document.getElementById("share-btn");
                btn.textContent = "✅ Ссылка скопирована!";
                setTimeout(() => {
                    btn.textContent = "🔗 Поделиться";
                }, 2500);
            });
        }
    </script>
</body>

</html>
