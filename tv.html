<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Телевизоры — Техно-Эксперт</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header id="site-header"></header>

    <main>
        <h1>📺 Всё о телевизорах</h1>
        <p style="color: var(--text-muted);">Выбор диагонали, настройка картинки и полезные расчеты.</p>

        <section class="tool-box">
            <h2>📏 Калькулятор расстояния до экрана</h2>
            <p style="margin-bottom: 1rem; color: var(--text-muted);">Введите диагональ телевизора в дюймах, чтобы
                узнать комфортное расстояние до дивана.</p>

            <div class="form-group">
                <label for="tv-diagonal">Диагональ телевизора (в дюймах):</label>
                <input type="number" id="tv-diagonal" placeholder="Например: 55" min="20" max="120">
            </div>
            <div class="form-group">
                <label for="tv-res">Разрешение экрана:</label>
                <select id="tv-res">
                    <option value="4k">4K Ultra HD (3840×2160)</option>
                    <option value="fhd">Full HD (1920×1080)</option>
                </select>
            </div>
            <button class="btn" onclick="calculateTvDistance()">Рассчитать</button>

            <div id="tv-result" class="result-box"></div>
        </section>

        <h2>Статьи о телевизорах</h2>
        <div id="tv-articles" class="grid"></div>
    </main>

    <footer id="site-footer"></footer>

    <script src="data.js"></script>
    <script>
        renderArticles("tv-articles", "tv");

        function calculateTvDistance() {
            const diag = parseFloat(document.getElementById("tv-diagonal").value);
            const res = document.getElementById("tv-res").value;
            const resultBox = document.getElementById("tv-result");

            if (!diag || diag < 15) {
                alert("Введите корректную диагональ (от 15 дюймов)");
                return;
            }

            const cm = diag * 2.54;
            const minDist = res === "4k" ? (cm * 1.2 / 100).toFixed(1) : (cm * 2.0 / 100).toFixed(1);
            const maxDist = res === "4k" ? (cm * 1.6 / 100).toFixed(1) : (cm * 2.5 / 100).toFixed(1);

            resultBox.style.display = "block";
            resultBox.innerHTML = `<strong>Рекомендуемое расстояние:</strong> от <b>${minDist} м</b> до <b>${maxDist} м</b> от глаз до экрана.`;
        }
    </script>
</body>

</html>
